services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes: 
      - mongo-data:/data/db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"

  # multiple backend instances to test nginx load balance
  server-1:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/chat_app_db
    depends_on:
      - mongo
      - minio
      - redis

  server-2:
    build: ./server
    ports:
      - "5001:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/chat_app_db
    depends_on:
      - mongo
      - minio
      - redis

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # api port
      - "9001:9001" # web ui port
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=12345678
    volumes:
      - minio-data:/data

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server-1
      - server-2
    restart: unless-stopped

volumes:
  mongo-data:
  minio-data:
  redis-data:
